[project]
name = "mcp-lab"
version = "0.1.0"
description = "Real MCP-tooled local AI assistant, red-teamed across 5 attack modules; staging ground for the wider agentic-AI benchmark projects."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Muhammad Hammas" }]

dependencies = [
    "mcp>=1.2.0",
    "langchain-core>=0.3.0",
    "langchain-ollama>=0.2.0",
    "pydantic>=2.7",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "httpx>=0.27",
    "datasets>=3.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["shared", "projects"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "live: requires a running ollama server (deselect with '-m \"not live\"')",
]
